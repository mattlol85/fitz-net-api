syntax = "proto3";

// gRPC equivalents of UserController (/user/*). Same rules as REST: Login and CreateUser are public,
// everything else needs "authorization: Bearer <jwt>" (or "x-admin-key") metadata.
package fitznet.api.v1;

option java_multiple_files = true;
option java_package = "org.fitznet.fitznetapi.grpc.proto";

service UserService {
  // POST /user/create
  rpc CreateUser(CreateUserRequest) returns (User);
  // POST /user/read (ADMIN). user is unset when no such user exists, like the REST empty body.
  rpc ReadUser(ReadUserRequest) returns (ReadUserResponse);
  // GET /user/me
  rpc GetMe(GetMeRequest) returns (User);
  // GET /user/readAll (ADMIN)
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // DELETE /user/delete - deletes the authenticated user
  rpc DeleteMe(DeleteMeRequest) returns (DeleteUserResponse);
  // PATCH /user/update - partial update of the authenticated user
  rpc UpdateUser(UpdateUserRequest) returns (UpdateProfileResponse);
  // PUT /user/update - profile form update of the authenticated user
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // POST /user/login
  rpc Login(LoginRequest) returns (LoginResponse);
}

message User {
  string id = 1;
  string username = 2;
  optional string email = 3;
  optional string board_color = 4;
  repeated string permissions = 5;
}

message CreateUserRequest {
  string username = 1;
  optional string email = 2;
  string password = 3;
}

message ReadUserRequest {
  string username = 1;
}

message ReadUserResponse {
  optional User user = 1;
}

message GetMeRequest {}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message DeleteMeRequest {}

message DeleteUserResponse {
  bool success = 1;
  string message = 2;
  string username = 3;
}

message UpdateUserRequest {
  optional string updated_username = 1;
  optional string updated_email = 2;
  optional string updated_password = 3;
}

message UpdateProfileRequest {
  string username = 1;
  string email = 2;
  optional string password = 3;
}

message UpdateProfileResponse {
  bool success = 1;
  string message = 2;
  string username = 3;
  optional string email = 4;
  optional string board_color = 5;
  repeated string permissions = 6;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
  string username = 3;
  optional string email = 4;
  string token = 5;
  optional string board_color = 6;
  repeated string permissions = 7;
}
