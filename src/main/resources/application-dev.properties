logging.level.org.springframework.security=DEBUG
# WARNING: Debug logging may expose sensitive information. Only use in development.

spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:test}

# Encryption key must be set via ENCRYPTION_KEY environment variable

# Development CORS - adds localhost:3000 for direct API calls outside the Vite proxy
cors.allowed-origins=https://fitznet.org,https://www.fitznet.org,https://fitznet.doomdns.org,https://api.fitznet.doomdns.org,https://gamerbell.fitznet.doomdns.org,http://localhost:3000

management.endpoints.web.cors.allowed-origins=${cors.allowed-origins}
