# JWT configuration - JWT_SECRET must be set (>=32 bytes); startup fails fast if missing
jwt.secret=${JWT_SECRET:}
# Access token lifetime: 2 hours
jwt.expiration=7200000

spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:test}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=read-only
management.prometheus.metrics.export.enabled=true
management.info.git.mode=full
management.info.build.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# CORS for actuator endpoints (browser dashboards)
management.endpoints.web.cors.allowed-origins=https://fitznet.org,https://www.fitznet.org,https://fitznet.doomdns.org,https://api.fitznet.doomdns.org,https://gamerbell.fitznet.doomdns.org,http://localhost:3000
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
management.endpoints.web.cors.allowed-headers=*
management.endpoints.web.cors.exposed-headers=Authorization,Content-Type
management.endpoints.web.cors.allow-credentials=true
management.endpoints.web.cors.max-age=3600

# Overwatch cron refresh settings
# Cron expression: run every 30 minutes
overwatch.refresh.cron=0 */30 * * * *
# Delay in milliseconds between each player refresh (3000ms = 3s, safely above OverFast's 2s Blizzard throttle)
overwatch.refresh.inter-request-delay-ms=3000
# Cooldown in minutes: skip users refreshed within this window
overwatch.refresh.cooldown-minutes=20
# Current competitive season label (update each season)
overwatch.current-season=Season 16

# Caffeine cache TTL (in seconds) for OverFast player data
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=900s
