# JWT configuration - JWT_SECRET must be set (>=32 bytes); startup fails fast if missing
jwt.secret=${JWT_SECRET:}
# Access token lifetime: 2 hours
jwt.expiration=7200000

# Optional service API key (X-Admin-Key header) granting ADMIN for scripted permission management.
# Leave unset to disable.
admin.api-key=${ADMIN_API_KEY:}

# gRPC server (src/main/proto): every REST endpoint has an equivalent RPC with the same auth rules,
# using "authorization: Bearer <jwt>" / "x-admin-key" metadata. Plaintext h2c; TLS terminates upstream.
spring.grpc.server.port=${GRPC_PORT:9090}

spring.mongodb.host=${MONGO_HOST:localhost}
spring.mongodb.port=${MONGO_PORT:27017}
spring.mongodb.database=${MONGO_DATABASE:test}
spring.mongodb.username=${MONGO_USERNAME:}
spring.mongodb.password=${MONGO_PASSWORD:}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=read-only
management.prometheus.metrics.export.enabled=true
management.info.git.mode=full
management.info.build.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# CORS for actuator endpoints (browser dashboards)
management.endpoints.web.cors.allowed-origins=https://fitznet.org,https://www.fitznet.org,https://fitznet.doomdns.org,https://api.fitznet.doomdns.org,https://gamerbell.fitznet.doomdns.org,https://logs.fitznet.org,https://logs.fitznet.doomdns.org,http://localhost:3000
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
management.endpoints.web.cors.allowed-headers=*
management.endpoints.web.cors.exposed-headers=X-Request-ID,X-Correlation-ID
management.endpoints.web.cors.exposed-headers=Authorization,Content-Type
management.endpoints.web.cors.allow-credentials=true
management.endpoints.web.cors.max-age=3600

# Outbound chat to AI nodes' Ollama (Fitz-Net#65). read-timeout is per socket read: for the
# buffered /node/{id}/chat it bounds the whole generation, for /node/{id}/chat/stream it's the
# longest allowed silence between chunks. max-stream-duration caps a streamed generation; hitting
# it (or the browser disconnecting) drops the upstream connection so Ollama stops generating.
ollama.connect-timeout=${OLLAMA_CONNECT_TIMEOUT:5s}
ollama.read-timeout=${OLLAMA_READ_TIMEOUT:180s}
ollama.max-stream-duration=${OLLAMA_MAX_STREAM_DURATION:10m}
ollama.max-num-ctx=${OLLAMA_MAX_NUM_CTX:8192}
# How long Ollama keeps a model in memory after a request (sent as keep_alive on every chat and warm-up).
ollama.keep-alive=${OLLAMA_KEEP_ALIVE:30m}

# Matt-GPT v2 node/model layer (docs/ai-chat-contract.md in the Fitz-Net hub).
# A node whose last heartbeat is older than this is OFFLINE (heartbeats arrive every ~2 minutes).
ai.node.stale-after=${AI_NODE_STALE_AFTER:5m}
# Installed-model list (/api/tags) cache per node.
ai.catalog.models-ttl=${AI_CATALOG_MODELS_TTL:60s}
# Loaded-model list (/api/ps) cache per node; short because warm state changes within seconds.
ai.catalog.loaded-ttl=${AI_CATALOG_LOADED_TTL:5s}
# Timeouts for the catalogue's calls to a node's Ollama (tags, ps, show, warm-up is not bound by these).
ai.catalog.connect-timeout=${AI_CATALOG_CONNECT_TIMEOUT:2s}
ai.catalog.read-timeout=${AI_CATALOG_READ_TIMEOUT:4s}
# GET /ai/models?refresh=true bypasses the caches at most once per node per this interval.
ai.catalog.force-refresh-interval=${AI_CATALOG_FORCE_REFRESH_INTERVAL:2s}
# While a turn is open the server writes a keep-alive whenever nothing was sent for this long; a
# failed write (browser gone) or a cancelled gRPC call then drops the upstream Ollama connection.
# The first write after a browser closed still succeeds (socket buffer) and only the second fails, so
# a closed connection is noticed within about two intervals.
ai.chat.cancel-poll-interval=${AI_CHAT_CANCEL_POLL_INTERVAL:1s}
# Longest accepted user message (characters); longer content is a 400.
ai.chat.max-message-chars=${AI_CHAT_MAX_MESSAGE_CHARS:32000}
# At most this many images on one message.
ai.chat.max-attachments-per-message=${AI_CHAT_MAX_ATTACHMENTS:4}
# Largest accepted image once decoded (bytes). Uploads bigger than this are a 400.
ai.chat.max-attachment-bytes=${AI_CHAT_MAX_ATTACHMENT_BYTES:3145728}
# An upload not attached to a message within this time is removed by a Mongo TTL index.
ai.chat.attachment-orphan-ttl=${AI_CHAT_ATTACHMENT_ORPHAN_TTL:24h}
# gRPC UploadAttachment carries the raw image in one message (3 MB + overhead). The gRPC default is
# 4 MiB; this is explicit so raising ai.chat.max-attachment-bytes is the only change needed.
spring.grpc.server.inbound.message.max-size=${GRPC_MAX_INBOUND_MESSAGE_SIZE:8MB}

# Joenet media host (Radarr/Sonarr), proxied by /joenet/{app}/** so the HTTPS site can reach the
# plain-HTTP LAN services. Same host as Fitz-Bot's JOENET_HOST; override with JOENET_HOST, or set it
# empty to disable (proxy returns 503).
joenet.host=${JOENET_HOST:joenet.doomdns.org}
joenet.radarr.port=7878
joenet.sonarr.port=8989
joenet.connect-timeout=${JOENET_CONNECT_TIMEOUT:5s}
joenet.read-timeout=${JOENET_READ_TIMEOUT:30s}

# Spring Boot 4 defaults Jackson 3 to different read/write behavior (e.g. failing on null primitives,
# sorting properties alphabetically). Keep the Spring Boot 3.5 Jackson 2 defaults so JSON handling is unchanged.
spring.jackson.use-jackson2-defaults=true

# Liveness/readiness probes are enabled by default in Spring Boot 4 but were off in 3.5 outside Kubernetes.
management.endpoint.health.probes.enabled=false

# End-to-end tracing: RequestTracingFilter / GrpcTracingInterceptor put correlationId in the MDC
logging.pattern.correlation=[%X{correlationId:-}] 
