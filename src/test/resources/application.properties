# Test configuration - provides defaults for required environment variables

# JWT configuration for tests
jwt.secret=testSecretKeyForJwtTokenGenerationInTestEnvironmentOnly
jwt.expiration=86400000

# Embedded MongoDB configuration - bumped to 6.0.14 for compatibility with the
# newer MongoDB Java driver's minimum required wire version (>= 8 / Mongo 4.2+)
de.flapdoodle.mongodb.embedded.version=6.0.14
spring.mongodb.embedded.version=6.0.14

# Disable MongoDB health check in tests
management.health.mongo.enabled=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=read-only
management.prometheus.metrics.export.enabled=true
